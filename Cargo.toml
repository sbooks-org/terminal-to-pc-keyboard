[package]
name = "pc-xt-keyboard"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Transport-neutral IBM PC/XT and PC/AT Set 1 keyboard mapper"
license = "MIT-0"
repository = "https://github.com/sbooks-org/terminal-to-pc-keyboard"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
crossterm-adapter = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.28.1", optional = true }

[[bin]]
name = "xt-keyboard-tester"
path = "src/bin/xt-keyboard-tester.rs"
required-features = ["crossterm-adapter"]
